# vLLM pooling servers in NVIDIA's NGC container, for hosts without a host vLLM install (the
# GB10). Same flags as the systemd units; weights are cached in the host's ~/.cache/huggingface.
# Chunked prefill is off, with a step budget of at least --max-model-len so a prompt is never
# split: on vLLM 0.13 a pooling request that got chunked next to many short ones stayed "Running"
# with no progress and hung the engine (reproduced with one ToolRet batch).
# From the repo root on the GB10:
#   docker compose -f deploy/spark/compose.yaml up -d
#   docker compose -f deploy/spark/compose.yaml ps
name: toolrank

x-vllm: &vllm
  image: nvcr.io/nvidia/vllm:26.01-py3
  restart: unless-stopped
  ipc: host
  shm_size: 4gb
  entrypoint: ["bash", "-c"]
  volumes:
    - ${HOME}/.cache/huggingface:/hf
  environment:
    HF_HOME: /hf
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30m # the first start downloads ~16 GB of weights

services:
  qwen3-8b-pooling:
    <<: *vllm
    container_name: toolrank-qwen3-8b
    ports: ["8090:8000"]
    command:
      - >-
        vllm serve Qwen/Qwen3-8B --served-model-name qwen3-8b --runner pooling
        --enable-prefix-caching --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 2048 --dtype bfloat16
        --gpu-memory-utilization 0.2 --host 0.0.0.0 --port 8000

  # bf16 vs FP8 backbone (week 2): the same model with weights quantized to FP8 at load. Off by
  # default:  docker compose -f deploy/spark/compose.yaml --profile fp8 up -d qwen3-8b-fp8
  qwen3-8b-fp8:
    <<: *vllm
    profiles: ["fp8"]
    container_name: toolrank-qwen3-8b-fp8
    ports: ["8092:8000"]
    command:
      - >-
        vllm serve Qwen/Qwen3-8B --served-model-name qwen3-8b-fp8 --runner pooling --quantization fp8
        --enable-prefix-caching --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 2048 --dtype bfloat16 --gpu-memory-utilization 0.15 --host 0.0.0.0 --port 8000

  # FP8 copy of the embedding model (Faz 1 week 6): the bf16 weights quantized to FP8 at load, to
  # measure against 8091 before it becomes the images' default. Off by default:
  #   docker compose -f deploy/spark/compose.yaml --profile fp8 up -d qwen3-embedding-8b-fp8
  qwen3-embedding-8b-fp8:
    <<: *vllm
    profiles: ["fp8"]
    container_name: toolrank-qwen3-emb-fp8
    ports: ["8094:8000"]
    command:
      - >-
        vllm serve Qwen/Qwen3-Embedding-8B --served-model-name qwen3-emb-fp8 --runner pooling
        --quantization fp8 --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.15 --host 0.0.0.0 --port 8000

  # Cross-encoders in Jev's role (Faz 2, `docs/reports/faz2-jev.md`): vLLM's score API over the
  # original rerankers, loaded as sequence classifiers (the recipes in vLLM's supported-models
  # page). The shares are of the GB10's unified memory (0.15 is 18 GB; bge-gemma failed to find
  # room for its cache blocks at 0.1). 8192 tokens per pair: the request is in every pair and one
  # LiveMCPBench task is 6000 characters of code-like text, 3000 tokens. Off by default:
  #   docker compose -f deploy/spark/compose.yaml --profile rerank up -d qwen3-reranker bge-reranker
  qwen3-reranker:
    <<: *vllm
    profiles: ["rerank"]
    container_name: toolrank-qwen3-reranker
    ports: ["8095:8000"]
    command:
      - >-
        vllm serve Qwen/Qwen3-Reranker-8B --served-model-name qwen3-reranker
        --hf-overrides '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
        --no-enable-chunked-prefill --max-num-batched-tokens 8192 --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.25 --host 0.0.0.0 --port 8000

  bge-reranker:
    <<: *vllm
    profiles: ["rerank"]
    container_name: toolrank-bge-reranker
    ports: ["8096:8000"]
    command:
      - >-
        vllm serve BAAI/bge-reranker-v2-gemma --served-model-name bge-reranker
        --hf-overrides '{"architectures": ["GemmaForSequenceClassification"], "classifier_from_token": ["Yes"], "method": "no_post_processing"}'
        --no-enable-chunked-prefill --max-num-batched-tokens 8192 --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.15 --host 0.0.0.0 --port 8000

  # The LoRA-merged embedding backbone (Faz 2, scripts/lora_train.py): the merged weights served
  # exactly like 8091, under their own name so the cache keeps them apart. Off by default:
  #   TOOLRANK_LORA=$HOME/toolrank/data/lora/qwen3-emb-lora-20k/merged \
  #     docker compose -f deploy/spark/compose.yaml --profile lora up -d qwen3-emb-lora
  qwen3-emb-lora:
    <<: *vllm
    profiles: ["lora"]
    container_name: toolrank-qwen3-emb-lora
    ports: ["8097:8000"]
    volumes:
      - ${HOME}/.cache/huggingface:/hf
      - ${TOOLRANK_LORA:-/nonexistent}:/models/lora:ro
    command:
      - >-
        vllm serve /models/lora --served-model-name qwen3-emb-lora --runner pooling
        --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.15 --host 0.0.0.0 --port 8000

  # The same merged weights quantized to FP8 at load (Faz 2 week 7): measured against 8097 before the
  # LoRA backbone becomes the images' default, as the base model was in Faz 1 week 6. Off by default:
  #   TOOLRANK_LORA=... docker compose -f deploy/spark/compose.yaml --profile lora-fp8 up -d qwen3-emb-lora-fp8
  qwen3-emb-lora-fp8:
    <<: *vllm
    profiles: ["lora-fp8"]
    container_name: toolrank-qwen3-emb-lora-fp8
    ports: ["8098:8000"]
    volumes:
      - ${HOME}/.cache/huggingface:/hf
      - ${TOOLRANK_LORA:-/nonexistent}:/models/lora:ro
    command:
      - >-
        vllm serve /models/lora --served-model-name qwen3-emb-lora-fp8 --runner pooling --quantization fp8
        --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.12 --host 0.0.0.0 --port 8000

  # Chat model that writes benchmark queries (MCP-Zero, week 4): the backbone's weights in the
  # default generate runner, so nothing new to download. Off by default:
  #   docker compose -f deploy/spark/compose.yaml --profile gen up -d qwen3-8b-chat
  qwen3-8b-chat:
    <<: *vllm
    profiles: ["gen"]
    container_name: toolrank-qwen3-8b-chat
    ports: ["8093:8000"]
    command:
      - >-
        vllm serve Qwen/Qwen3-8B --served-model-name qwen3-8b-chat --enable-prefix-caching
        --max-model-len 4096 --dtype bfloat16 --gpu-memory-utilization 0.2 --host 0.0.0.0 --port 8000

  # Postgres + pgvector for the pgvector index (Faz 1 week 2): tests and trials only, bound to
  # 127.0.0.1. Off by default:
  #   docker compose -f deploy/spark/compose.yaml --profile pg up -d toolrank-pg
  #   export TOOLRANK_PG_DSN=postgresql://toolrank:toolrank@127.0.0.1:55440/toolrank
  toolrank-pg:
    image: pgvector/pgvector:pg17
    profiles: ["pg"]
    container_name: toolrank-pg
    restart: unless-stopped
    ports: ["127.0.0.1:55440:5432"]
    environment:
      POSTGRES_USER: toolrank
      POSTGRES_PASSWORD: toolrank
      POSTGRES_DB: toolrank
    volumes:
      - toolrank-pg:/var/lib/postgresql/data

  qwen3-embedding-8b:
    <<: *vllm
    container_name: toolrank-qwen3-emb
    ports: ["8091:8000"]
    # start after the backbone is up, so the two startup memory checks don't race
    depends_on:
      qwen3-8b-pooling:
        condition: service_healthy
    command:
      - >-
        vllm serve Qwen/Qwen3-Embedding-8B --served-model-name qwen3-emb --runner pooling
        --no-enable-chunked-prefill --max-num-batched-tokens 8192
        --max-model-len 8192 --dtype bfloat16
        --gpu-memory-utilization 0.2 --host 0.0.0.0 --port 8000

volumes:
  toolrank-pg:
